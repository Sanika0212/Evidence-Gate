global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: services
    static_configs:
      - targets: ["retriever:9100", "checker:9100", "calibrator:9100", "triage-worker:9100"]
