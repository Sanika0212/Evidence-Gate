include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  evidencegate-triage {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "evidencegate-triage-dlq"
      maxReceiveCount = 5
    }
  }
  evidencegate-triage-dlq {}
}
