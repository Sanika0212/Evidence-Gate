# prometheus-community/prometheus: server plus kube-state-metrics; pods are scraped by
# their prometheus.io/* annotations. The SLO rules are merged in by
# scripts/render_obs_values.py (kind) or Terraform (EKS).
alertmanager: { enabled: false }
prometheus-pushgateway: { enabled: false }
prometheus-node-exporter: { enabled: false }
server:
  retention: 7d
  persistentVolume: { enabled: false }
  resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  global: { scrape_interval: 15s, evaluation_interval: 30s }
