# Local kind cluster: models from a hostPath, every dependency in-cluster,
# canary rollouts on, small resource requests so it fits on a laptop.
image: { repository: evidencegate, tag: dev, pullPolicy: Never }
models: { source: hostPath, hostPath: /models }
config:
  s3Endpoint: http://evidence-gate-s3:8333
  sqsEndpoint: http://evidence-gate-sqs:9324
  otlpEndpoint: ""
secrets: { reviewToken: local-review-token }
gateway:
  replicas: 1
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
  hpa: { enabled: true, min: 1, max: 3, cpu: 70 }
  ingress: { enabled: true, className: nginx, host: "" }
checker:
  replicas: 1
  resources: { requests: { cpu: 500m, memory: 1536Mi }, limits: { memory: 2560Mi } }
  hpa: { enabled: true, min: 1, max: 3, cpu: 65 }
retriever:
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
  hpa: { enabled: false, min: 1, max: 2, cpu: 70 }
triageWorker:
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
rollouts:
  enabled: true
  prometheusAddress: http://prometheus-server.observability.svc.cluster.local
  pauseSeconds: 45
deps:
  postgres: { enabled: true, storage: 2Gi }
  redis: { enabled: true }
  s3: { enabled: true }
  sqs: { enabled: true }
