{{- /*
In-cluster stand-ins for managed services. On a local cluster all four run here; on
EKS, Postgres and Redis can run here to save cost while S3 and SQS are the real thing.
*/ -}}
{{- if .Values.deps.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evidence-gate-postgres
  labels: {{- include "eg.labels" . | nindent 4 }}
spec:
  serviceName: evidence-gate-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: evidence-gate }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_USER, value: evidencegate }
            - { name: POSTGRES_PASSWORD, value: evidencegate }
            - { name: POSTGRES_DB, value: evidencegate }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "evidencegate"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.deps.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-gate-postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
{{- end }}
{{- if .Values.deps.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-gate-redis
  labels: {{- include "eg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: evidence-gate }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-gate-redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- end }}
{{- if .Values.deps.s3.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-gate-s3
  labels: {{- include "eg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: s3 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: s3, app.kubernetes.io/part-of: evidence-gate }
    spec:
      containers:
        - name: s3
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
          ports: [{ name: s3, containerPort: 8333 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-gate-s3
spec:
  selector: { app.kubernetes.io/name: s3 }
  ports: [{ name: s3, port: 8333, targetPort: s3 }]
{{- end }}
{{- if .Values.deps.sqs.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-gate-sqs
data:
  elasticmq.conf: |
{{ .Files.Get "files/elasticmq.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-gate-sqs
  labels: {{- include "eg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: sqs } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sqs, app.kubernetes.io/part-of: evidence-gate }
    spec:
      containers:
        - name: sqs
          image: softwaremill/elasticmq-native:1.6.9
          ports: [{ name: sqs, containerPort: 9324 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: conf, mountPath: /opt/elasticmq.conf, subPath: elasticmq.conf }]
      volumes: [{ name: conf, configMap: { name: evidence-gate-sqs } }]
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-gate-sqs
spec:
  selector: { app.kubernetes.io/name: sqs }
  ports: [{ name: sqs, port: 9324, targetPort: sqs }]
{{- end }}
